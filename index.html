<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Electric Vehicles</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Compare Electric Vehicles</h1>
            <p class="subtitle">Find the perfect EV for your needs</p>
        </header>

        <div class="vehicle-selector">
            <div class="vehicle-option">
                <h2>Vehicle 1</h2>
                <select class="category-select" id="category1">
                    <option value="all">All Categories</option>
                    <option value="two-wheeler">Top Two Wheeler</option>
                    <option value="three-wheeler">Top Three Wheeler</option>
                    <option value="four-wheeler">Top Four Wheeler</option>
                </select>
                <select class="vehicle-select" id="vehicle1-select">
                    <option value="">Select vehicle</option>
                </select>
            </div>

            <div class="vehicle-option">
                <h2>Vehicle 2</h2>
                <select class="category-select" id="category2">
                    <option value="all">All Categories</option>
                    <option value="two-wheeler">Top Two Wheeler</option>
                    <option value="three-wheeler">Top Three Wheeler</option>
                    <option value="four-wheeler">Top Four Wheeler</option>
                </select>
                <select class="vehicle-select" id="vehicle2-select">
                    <option value="">Select vehicle</option>
                </select>
            </div>
        </div>

        <div class="loading" id="loadingIndicator">
            <p>Loading vehicle data...</p>
        </div>

        <button class="compare-btn" id="compareButton">Compare Vehicles</button>

        <div class="comparison-section" id="comparisonResults">
            <!-- Comparison content will be loaded here -->
        </div>

      
    </div>

    <script src="script.js"></script>
</body>
</html>
